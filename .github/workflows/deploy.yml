name: Deploy Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run offline governance regression suite
        env:
          # Tests import the model-routing module but do not make provider calls.
          # Keep CI deterministic without exposing production API credentials.
          DEEPSEEK_API_KEY: ci-test-placeholder
          DASHSCOPE_API_KEY: ci-test-placeholder
        run: python -m unittest discover -s tests -t . -p "test_*.py"

  deploy:
    needs: regression
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.NEON_ALPHA }}
          script: |
            cd /home/ubuntu/Alpha_stock
            git pull
            source /home/ubuntu/venv/bin/activate
            pip install -r requirements.txt -q
            systemctl restart alphastock-api.service
            echo "✅ Backend deployed successfully"

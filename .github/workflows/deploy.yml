name: Deploy Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install offline regression dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
      - name: Run offline governance regression suite
        env:
          # Keep CI deterministic without reading a checked-out .env file or
          # exposing production credentials. tests/conftest.py blocks sockets
          # for the complete pytest collection.
          DEEPSEEK_API_KEY: ci-test-placeholder
          DASHSCOPE_API_KEY: ci-test-placeholder
          ALPHASTOCK_SKIP_DOTENV: "1"
          ALPHASTOCK_OFFLINE_TESTS: "1"
        run: |
          set +e
          python -m pytest -q tests --junitxml=pytest-results.xml
          status=$?
          if [ "$status" -ne 0 ]; then
            python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("pytest-results.xml").getroot()
          emitted = 0
          for case in root.iter("testcase"):
              failure = case.find("failure")
              if failure is None:
                  failure = case.find("error")
              if failure is None:
                  continue
              classname = case.attrib.get("classname", "tests")
              name = case.attrib.get("name", "unknown")
              detail = (failure.text or failure.attrib.get("message", "")).strip()
              detail = " ".join(detail.split())[:1000]
              print(f"::error title=pytest failure::{classname}.{name}: {detail}")
              emitted += 1
              if emitted >= 10:
                  break
          PY
          fi
          exit "$status"

  production-quality-gate:
    needs: regression
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: vars.ENFORCE_PRODUCTION_QUALITY_GATE == 'true'
        with:
          python-version: "3.11"
      - name: Verify immutable production quality evidence
        if: vars.ENFORCE_PRODUCTION_QUALITY_GATE == 'true'
        run: |
          python -m evaluation.release_quality_evidence \
            --spec evaluation/releases/active/release-evidence.json \
            --root . \
            --out runtime/reports/release-quality-evidence.json
      - name: Report staged gate status
        if: vars.ENFORCE_PRODUCTION_QUALITY_GATE != 'true'
        run: echo "Production Gold gate is staged; set ENFORCE_PRODUCTION_QUALITY_GATE=true only after real evidence is frozen."

  deploy:
    needs: [regression, production-quality-gate]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.NEON_ALPHA }}
          script: |
            set -Eeuo pipefail
            cd /home/ubuntu/Alpha_stock
            repository_url="https://github.com/Neon549/AlphaStock.git"
            # The deploy account intentionally does not own the application
            # tree. Scope Git's ownership exception to this exact path rather
            # than weakening the server-wide safe-directory policy.
            git -c safe.directory=/home/ubuntu/Alpha_stock remote set-url origin "${repository_url}"
            previous_revision="$(git -c safe.directory=/home/ubuntu/Alpha_stock rev-parse HEAD)"

            rollback() {
              exit_code=$?
              trap - ERR
              set +e
              echo "Deployment failed; rolling back to ${previous_revision}"
              git -c safe.directory=/home/ubuntu/Alpha_stock reset --hard "${previous_revision}"
              source /home/ubuntu/venv/bin/activate
              pip install -r requirements.txt -q
              sudo systemctl restart alphastock-api.service
              recovered=0
              for rollback_attempt in $(seq 1 18); do
                if sudo systemctl is-active --quiet alphastock-api.service \
                  && (curl --fail --silent --max-time 3 http://127.0.0.1:8000/health/live >/dev/null \
                    || curl --fail --silent --max-time 3 http://127.0.0.1:8000/health >/dev/null); then
                  recovered=1
                  break
                fi
                sleep 5
              done
              if [ "${recovered}" -ne 1 ]; then
                echo "Rollback service did not become healthy within 90 seconds" >&2
              fi
              exit "${exit_code}"
            }
            trap rollback ERR

            pulled=0
            for pull_attempt in $(seq 1 3); do
              if git -c safe.directory=/home/ubuntu/Alpha_stock \
                -c http.version=HTTP/1.1 pull --ff-only origin main; then
                pulled=1
                break
              fi
              echo "Git pull attempt ${pull_attempt}/3 failed; retrying in 5 seconds"
              sleep 5
            done
            if [ "${pulled}" -ne 1 ]; then
              echo "Unable to fetch ${repository_url}" >&2
              false
            fi
            source /home/ubuntu/venv/bin/activate
            pip install -r requirements.txt -q
            sudo systemctl restart alphastock-api.service

            ready=0
            for attempt in $(seq 1 18); do
              if curl --fail --silent --show-error --max-time 3 \
                http://127.0.0.1:8000/health/ready >/dev/null; then
                ready=1
                break
              fi
              echo "Readiness attempt ${attempt}/18 failed; retrying in 5 seconds"
              sleep 5
            done
            if [ "${ready}" -ne 1 ]; then
              echo "Readiness did not pass within 90 seconds"
              false
            fi

            trap - ERR
            echo "✅ Backend deployed and readiness verified"

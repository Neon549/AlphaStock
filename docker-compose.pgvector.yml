services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: alphastock-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_DB: alphastock
      POSTGRES_USER: alphastock
      # 仅供本地开发；生产环境必须通过部署平台的 secret 注入强密码。
      POSTGRES_PASSWORD: alphastock_local_dev_only
    ports:
      # 避开本机已安装 PostgreSQL 默认占用的 5432 端口。
      - "5433:5432"
    volumes:
      - alphastock_pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alphastock -d alphastock"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  alphastock_pgvector_data:
